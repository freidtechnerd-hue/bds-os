set timeout=3
set default=0
set gfxmode=800x600x32
set gfxpayload=keep
insmod all_video
terminal_output console
menuentry "BDS-OS Graphical Desktop" { multiboot2 /boot/kernel.elf desktop origin=$cmdpath; boot; }
menuentry "BDS-OS Command Line" { multiboot2 /boot/kernel.elf shell origin=$cmdpath; boot; }
menuentry "BDS-OS Game Center" { multiboot2 /boot/kernel.elf games origin=$cmdpath; boot; }
menuentry "System Diagnostics" { multiboot2 /boot/kernel.elf diagnostics origin=$cmdpath; boot; }
menuentry "Desktop 800x600 (ignore saved settings)" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=800x600x32; boot; }
menuentry "Desktop 640x480" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=640x480x32,800x600x32; boot; }
menuentry "Desktop 1024x768" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1024x768x32,800x600x32; boot; }
menuentry "Desktop 1280x720" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1280x720x32,800x600x32; boot; }
menuentry "Desktop 1280x800" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1280x800x32,800x600x32; boot; }
menuentry "Desktop 1280x1024" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1280x1024x32,800x600x32; boot; }
menuentry "Desktop 1366x768" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1366x768x32,800x600x32; boot; }
menuentry "Desktop 1360x768" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1360x768x32,800x600x32; boot; }
menuentry "Desktop 1440x900" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1440x900x32,800x600x32; boot; }
menuentry "Desktop 1600x900" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1600x900x32,800x600x32; boot; }
menuentry "Desktop 1920x1080" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1920x1080x32,800x600x32; boot; }
menuentry "Desktop 1920x1200" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1920x1200x32,800x600x32; boot; }
menuentry "Desktop 1680x1050" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=1680x1050x32,800x600x32; boot; }
menuentry "Desktop 2560x1080" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=2560x1080x32,800x600x32; boot; }
menuentry "Desktop 2560x1440" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=2560x1440x32,800x600x32; boot; }
menuentry "Desktop 2560x1600" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=2560x1600x32,800x600x32; boot; }
menuentry "Desktop 3440x1440" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=3440x1440x32,800x600x32; boot; }
menuentry "Desktop 3840x2160" { multiboot2 /boot/kernel.elf desktop-safe origin=$cmdpath; set gfxpayload=3840x2160x32,800x600x32; boot; }
menuentry "Reboot" { reboot; }
